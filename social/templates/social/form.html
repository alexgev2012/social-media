{% extends 'social/base.html' %}
{% block title %}{{ title }} · Social{% endblock %}
{% block content %}
<section class="django-card">
  <h1>{{ title }}</h1>
  <form method="post" enctype="multipart/form-data" class="django-form">
    {% csrf_token %}{{ form.as_p }}
    <button class="primary">{{ submit }}</button>
  </form>
</section>
{% endblock %}
